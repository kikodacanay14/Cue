name: Test Cue
# Runs the Cue tests on every pull request and every push to main, so a finished feature can merge as soon as it is
# green and nothing waits to be merged at deploy time.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, kkd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/cue.test.js
