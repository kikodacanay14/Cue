name: Check Cue
# Cloud check (spec canvas-integration/specs/cue-cloud-check.md, Kiko ok 27 Oct 2026 08:28Z): a robot browser runs a check
# script (test/checks/*.check.mjs) against a key-locked "Cue check" link, so a PC check no longer needs Kiko at his PC.
# tools/check.mjs open makes a one-run key, pushes a check-mode copy as one Apps Script version, points the "Cue check"
# deployment at it and puts the head back exactly as it was. Writes reach only the Canvas test project in
# test/checks/config.json; emails go only to addresses matching its mail pattern. Live /exec is never touched.
# The link always shuts at the end (tools/check.mjs close), pass or fail, and by itself after 45 minutes.
# Report: the "cue-check" artifact (report.html with a screenshot per step) and the run summary.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to check (for example rel12733)
        required: true
        default: main
      script:
        description: Check script in test/checks (for example 1.27.33-crew-docs)
        required: true
permissions:
  contents: read
concurrency: deploy-cue
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check script exists
        env:
          SCRIPT: ${{ inputs.script }}
          REF: ${{ inputs.ref }}
        run: |
          case "$SCRIPT" in *[!A-Za-z0-9._-]*|'') echo "script must be a name like 1.27.33-crew-docs"; exit 1;; esac
          [ -f "test/checks/$SCRIPT.check.mjs" ] || { echo "No test/checks/$SCRIPT.check.mjs on $REF"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node test/cue.test.js
      - run: npm install -g @google/clasp@3.4.1
      - name: Install the robot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Load the saved Google sign-in
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          [ -f .deploy/clasprc.enc ] || { echo "Not connected yet: run Connect Google first"; exit 1; }
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DEPLOY_KEY -a -in .deploy/clasprc.enc -out ~/.clasprc.json
      - name: Open the check link
        id: open
        run: node tools/check.mjs open
      - name: Run the check
        env:
          CUE_CHECK_URL: ${{ steps.open.outputs.url }}
          CUE_CHECK_KEY: ${{ steps.open.outputs.key }}
          SCRIPT: ${{ inputs.script }}
        run: node test/checks/run.mjs "test/checks/$SCRIPT.check.mjs" check-out
      - name: Shut the check link
        if: always()
        run: node tools/check.mjs close
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cue-check
          path: check-out/
          if-no-files-found: ignore
      - if: always()
        run: rm -f ~/.clasprc.json
