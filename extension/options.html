<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cue bubble settings</title>
<style>
  body{margin:0;background:#141518;color:#e4e6ea;font:500 15px/1.5 'DM Sans',system-ui,sans-serif;padding:24px max(16px,4vw)}
  main{max-width:620px} h1{font-size:20px;color:#fff} label{display:block;font-weight:600;margin:16px 0 6px}
  input{width:100%;box-sizing:border-box;background:#1d1f24;color:#e4e6ea;border:1px solid #3d4250;border-radius:6px;padding:10px;font:inherit}
  input:focus,button:focus-visible{outline:2px solid #F4F12C;outline-offset:1px}
  button{margin-top:14px;border:0;border-radius:9999px;min-height:44px;padding:0 20px;font:700 14px 'DM Sans',system-ui,sans-serif;background:#F4F12C;color:#16151B;cursor:pointer}
  button.ghost{background:transparent;color:#e4e6ea;border:1px solid #3d4250;margin-left:8px}
  .muted{color:#a3a7b0;font-size:13px} #msg{margin-top:12px;min-height:1.5em}
</style></head>
<body><main>
  <h1>Cue bubble</h1>
  <p class="muted">The bubble opens your Cue web app. Paste Cue's web app address from Deploy › Manage deployments in the Cue Apps Script project. It ends in /exec.</p>
  <label for="url">Cue address</label>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <button id="save">Save</button><button class="ghost" id="reset">Show the bubble on every site again</button>
  <div id="msg" role="status"></div>
</main><script src="options.js"></script></body></html>
