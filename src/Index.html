<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Cue design canvas tokens (Chat.dc.html): graphite, magenta = needs you, sky = action. */
  :root { --font:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --display:'Archivo Black', 'DM Sans', system-ui, sans-serif; --bg:#141518; --head:#0e0f11; --panel:#262930; --input:#1d1f24; --line:#34373f; --line2:#3d4250; --muted:#a3a7b0;
    --text:#e4e6ea; --white:#fff; --need:#b00c98; --act:#559fef; --ok:#3fbf7f; --warn:#e9d151; --bad:#cd5023; }
  * { box-sizing:border-box; }
  /* The page never scrolls: header, tabs and composer stay put, and only the middle (chat or widgets) scrolls. */
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:500 15px/1.5 var(--font); display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  header, nav, .composer { flex:none; }
  #scroller { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
  header { z-index:5; background:var(--head); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:10px 16px; }
  .logo { width:30px; height:30px; border-radius:50%; background:conic-gradient(#2b0169,#b00c98,#cd5023,#e9d151,#559fef,#2b0169); flex:none; }
  /* BSE brand (Website look, Kiko 2026-10-11): DM Sans for text, Archivo Black for the title only. */
  header h1 { margin:0; font:400 20px/1.1 var(--display); letter-spacing:.01em; color:var(--white); }
  .card b { letter-spacing:-0.01em; }
  header .sub { color:var(--muted); font-size:13px; }
  header .dot { margin-left:auto; width:9px; height:9px; border-radius:50%; background:var(--ok); }
  nav { display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--head); }
  .tab { border:1px solid var(--line2); background:transparent; color:var(--text); border-radius:9999px; min-height:44px; padding:0 18px; font:600 14px var(--font); cursor:pointer; }
  .tab[aria-selected="true"] { background:var(--panel); border-color:var(--act); color:var(--white); }
  .badge { display:inline-block; min-width:20px; padding:0 6px; margin-left:6px; border-radius:9999px; background:var(--need); color:#fff; font-size:12px; }
  main { display:flex; gap:20px; padding:16px; max-width:1200px; margin:0 auto; }
  .col { flex:1; max-width:820px; min-width:0; }
  aside { width:340px; flex:none; }
  @media (max-width: 1000px) { aside { display:none; } }
  .label { font-size:12px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:18px 0 8px; font-weight:700; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px; margin-bottom:12px; }
  .card.need { border-left:4px solid var(--need); }
  .msgs { display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:6px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.me { align-self:flex-end; background:#22344d; }
  .msg.cue { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }
  /* Threads (Kiko 06:07Z, like Claude's project chat): a task's first message shows in the chat with a reply counter; its replies and cards live in the thread. */
  .thread-row { all:unset; box-sizing:border-box; align-self:flex-start; display:flex; align-items:center; gap:8px; margin:-4px 0 4px; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--muted); max-width:85%; }
  .msg.me + .thread-row { align-self:flex-end; }
  .thread-row:hover, .thread-row:focus-visible { background:var(--panel); color:var(--text); }
  .thread-row b { color:var(--act); font-weight:700; }
  .thread-row .need { color:#f07bd9; font-weight:700; }
  .thread-row .tt { color:var(--text); font-weight:600; text-decoration:underline; text-decoration-color:transparent; }
  .thread-row:hover .tt { text-decoration-color:currentColor; }
  .msg[data-thread] { cursor:pointer; }
  .thread-head { position:sticky; top:0; z-index:2; background:var(--bg); display:flex; align-items:center; gap:10px; margin:-16px -4px 14px; padding:12px 4px 8px; }
  .thread-head .back { all:unset; cursor:pointer; color:var(--act); font-weight:700; padding:8px 4px; }
  .thread-head .back:focus-visible { outline:2px solid var(--act); border-radius:6px; }
  .thread-head .t { font-weight:700; color:var(--white); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .taskbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; font-size:13px; color:var(--muted); }
  .taskbar input, .taskbar select { min-height:36px; padding:4px 8px; font-size:13px; } .taskbar .btn { min-height:36px; padding:0 14px; font-size:13px; }
  .say { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); cursor:default; }
  .say .row input { flex:1; min-width:0; min-height:40px; } .say .btn { min-height:40px; }
  .say-last { margin-bottom:6px; }
  .tap { cursor:pointer; } .tap > .card { transition:border-color .15s; } .tap:hover > .card { border-color:var(--line2); }
  .msg .who { font-size:12px; color:var(--muted); display:block; margin-bottom:2px; }
  .composer { background:var(--head); border-top:1px solid var(--line); padding:10px 16px; }
  .composer .in { max-width:1200px; margin:0 auto; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  textarea, input, select { background:var(--input); color:var(--text); border:1px solid var(--line2); border-radius:6px; font:500 14px var(--font); padding:8px 10px; }
  textarea { flex:1; min-height:44px; max-height:200px; resize:vertical; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline:2px solid var(--act); outline-offset:1px; }
  .card a { color:var(--act); }
  .btn { border:0; border-radius:9999px; min-height:44px; padding:0 18px; font:700 14px var(--font); cursor:pointer; background:var(--act); color:#0b1320; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line2); }
  .btn.bad { background:transparent; color:#ff9b7a; border:1px solid #6a3a2c; }
  .btn:disabled { opacity:.45; cursor:default; }
  .attach { width:44px; min-height:44px; padding:0; flex:none; font-size:20px; }
  .files { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .files:empty { display:none; }
  .file { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); border-radius:9999px; padding:4px 6px 4px 12px; font-size:13px; background:var(--input); }
  .file button { border:0; background:transparent; color:var(--muted); cursor:pointer; font:700 14px system-ui, sans-serif; width:24px; height:24px; border-radius:50%; }
  .file button:hover { color:var(--text); background:var(--line); }
  .composer.drop { outline:2px dashed var(--act); outline-offset:-6px; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line2); border-radius:8px; padding:18px; width:min(420px, calc(100vw - 48px)); }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .chip { border:1px solid var(--line2); border-radius:9999px; padding:6px 12px; font-size:13px; color:var(--muted); background:transparent; cursor:pointer; font-family:inherit; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .worker { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:12px; font-weight:700; background:#1f2b3d; color:var(--act); }
  .work-head { all:unset; box-sizing:border-box; width:100%; display:flex; justify-content:space-between; gap:8px; align-items:center; cursor:pointer; }
  .work-head:focus-visible { outline:2px solid var(--act); outline-offset:4px; border-radius:8px; }
  .chev { color:var(--muted); font-size:14px; }
  .steps { list-style:none; margin:10px 0 0; padding:0; }
  .steps li { display:flex; gap:8px; align-items:center; padding:3px 0; font-size:14px; color:var(--muted); }
  .steps li .d { width:9px; height:9px; border-radius:50%; background:var(--line2); flex:none; }
  .steps li.done { color:var(--text); } .steps li.done .d { background:var(--ok); }
  .steps li.now { color:var(--white); font-weight:700; } .steps li.now .d { background:var(--act); box-shadow:0 0 0 4px rgba(85,159,239,.25); }
  .bar { height:6px; background:var(--input); border-radius:9999px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; background:var(--act); transition:width .4s; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .facts td:first-child { color:var(--muted); width:42%; }
  .tag { display:inline-block; padding:0 8px; border-radius:9999px; font-size:11px; font-weight:700; margin:1px 2px 1px 0; }
  .tag.new { background:#3a2a05; color:var(--warn); } .tag.pref { background:#13321f; color:var(--ok); } .tag.flag { background:#3d1430; color:#f07bd9; }
  .warn { background:#3d1430; border:1px solid var(--need); border-radius:6px; padding:8px 10px; margin:8px 0; font-size:13px; }
  .err { background:#3a1c13; border:1px solid var(--bad); border-radius:6px; padding:8px 10px; margin:8px 0; font-size:13px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  details { margin-top:8px; } summary { cursor:pointer; color:var(--act); font-weight:600; }
  pre { white-space:pre-wrap; font:500 13px/1.5 var(--font); background:var(--input); padding:10px; border-radius:6px; }
  .scroll { overflow-x:auto; }
  .edit input { width:90px; } .edit input.wide { width:100%; }
  textarea.mail { display:block; width:100%; min-height:140px; margin-top:8px; resize:vertical; font:500 14px/1.5 var(--font); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <div><h1>Cue</h1><div class="sub">One chat. Each task gets its own thread.</div></div>
  <span class="dot" id="dot" title="Connected"></span>
</header>
<nav role="tablist">
  <button class="tab" role="tab" id="tab-chat" aria-selected="true">Chat</button>
  <button class="tab" role="tab" id="tab-widgets" aria-selected="false">Widgets<span class="badge" id="needCount" hidden></span></button>
</nav>
<div id="scroller">
<main>
  <section class="col" id="page-chat">
    <div class="msgs" id="msgs"></div>
  </section>
  <section class="col" id="page-thread" hidden>
    <div class="thread-head"><button class="back" id="back" aria-label="Back to the chat">← Chat</button><i class="dot" id="t-dot"></i><span class="t" id="t-title"></span><span class="small muted" id="t-status"></span></div>
    <div class="msgs" id="tmsgs"></div>
  </section>
  <section class="col" id="page-widgets" hidden>
    <div class="label">Needs you</div><div id="w-need"></div>
    <div class="label">Working on</div><div id="w-work"></div>

    <div class="label">Recently done</div><div id="w-done"></div>
    <div class="label">Chaser rules</div><div id="w-rules"></div>
  </section>
  <aside id="pinned">
    <div class="label">Pinned widgets</div>
    <div id="p-need"></div><div id="p-work"></div>
  </aside>
</main>
</div>
<dialog id="ask" aria-labelledby="ask-t">
  <form method="dialog">
    <b id="ask-t" style="font-size:17px;color:#fff"></b>
    <div class="small muted" id="ask-sub" style="margin:4px 0 12px"></div>
    <input id="ask-in" style="width:100%;box-sizing:border-box">
    <div class="actions" style="justify-content:flex-end"><button class="btn ghost" value="cancel">Cancel</button><button class="btn bad" id="ask-ok" value="ok">OK</button></div>
  </form>
</dialog>
<div class="composer" id="composer" data-cue-app="1">
  <div class="in">
    <div class="files" id="files" aria-live="polite"></div>
    <div class="row">
      <button class="btn ghost attach" id="attach" title="Attach photos, PDFs or text files" aria-label="Attach files">📎</button>
      <button class="btn ghost attach" id="snap" hidden title="Snap the page you were looking at (Alt+Shift+S works too)" aria-label="Snap the page you were looking at">📷</button>
      <input type="file" id="picker" multiple hidden accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain,text/csv,.eml,.txt,.csv">
      <textarea id="box" placeholder="Ask Cue, or paste an inquiry. 📎 adds briefs, photos and plans." aria-label="Message"></textarea>
      <button class="btn" id="send">Send</button>
    </div>
    <div class="chips">
      <button class="chip" data-fill="New project intake. Client inquiry:&#10;">New project intake</button>
      <button class="chip" id="chip-need">What needs me?</button>
      <button class="chip" data-fill="Who owes us money, and what do we owe suppliers?">Money check</button>
      <button class="chip" data-fill="Clean up HubSpot">Clean up HubSpot</button>
      <button class="chip" id="chip-area" hidden>Snap an area</button>
      <button class="chip" id="chip-intake" hidden>Start an intake with that message</button>
    </div>
  </div>
</div>
<script>
(function () {
  var state = { requests: [], chat: [], metrics: {} }, editing = {}, polling = null, running = {};
  // Expenses (Kiko 07:27Z): their files stay here, never in Cue uploads, until Approve sends them to the project's Admin folder.
  var held = {}, expRoute = {}, EXP_RE = /\b(record (an? |this |the )?(expense|payment)|expenses?|receipts?|official receipt|proof of (payment|transfer)|liquidat\w*|reimburs\w*|paid (to|for|via|in cash|cash|by))\b/i;
  var EXPENSE = [['GPT reading', 'GPT', 'GPT reads your line and the files'], ['Checking Canvas', 'Canvas', 'Canvas finds the project and its records'],
    ['Claude matching', 'Claude', 'Claude matches it to a request or a scope'], ['Needs you', 'Kiko', 'Waiting for your approval'], ['Writing to Canvas', 'Canvas', 'Canvas records it and reads it back']];
  var STEPS = [['GPT reading', 'GPT', 'GPT reads the request'], ['Checking Canvas', 'Canvas', 'Canvas checks duplicates, prices and history'],
    ['Claude costing', 'Claude + GPT', 'Claude costs the CE while GPT researches the gaps'], ['GPT drafting RFQs', 'GPT', 'GPT drafts one RFQ per supplier'],
    ['Needs you', 'Kiko', 'Waiting for your approval']];
  var WRITE = [['Canvas re-checking', 'Canvas', 'Canvas re-checks the numbers'], ['Writing to Canvas', 'Canvas', 'Canvas writes and reads back'],
    ['Making Gmail drafts', 'Gmail', 'RFQs become Gmail drafts'], ['Done', 'Done', 'Done']];
  var HSTEPS = [['Reading HubSpot', 'Canvas', 'Canvas reads HubSpot and Client Desk (changes nothing)'], ['Claude checking', 'Claude', 'Claude checks the look-alikes and names'],
    ['GPT looking up', 'GPT', 'ChatGPT looks up missing websites'], ['Fixing', 'Canvas', 'Canvas applies the ticked fixes and reads them back'], ['Needs you', 'Kiko', 'Waiting for your approval']];
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function peso(n) { return 'PHP ' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
  function call(fn, args, ok, bad) {
    var r = google.script.run.withSuccessHandler(function (x) { $('dot').style.background = 'var(--ok)'; ok && ok(x); })
      .withFailureHandler(function (e) { $('dot').style.background = 'var(--bad)'; (bad || alertErr)(e); });
    r[fn].apply(r, args || []);
  }
  // Cue's own question box (the browser's prompt() shows the Apps Script sandbox address).
  function ask(title, sub, placeholder, okLabel, cb) {
    var d = $('ask'); $('ask-t').textContent = title; $('ask-sub').textContent = sub; $('ask-in').value = ''; $('ask-in').hidden = placeholder === null; $('ask-in').placeholder = placeholder || ''; $('ask-ok').textContent = okLabel;
    d.onclose = function () { if (d.returnValue === 'ok') cb($('ask-in').value.trim()); };
    d.returnValue = ''; d.showModal(); if (placeholder !== null) $('ask-in').focus(); else $('ask-ok').focus();
  }
  function alertErr(e) { var m = (e && e.message) || String(e); if (ACCESS_RE.test(m)) { accessNeeded = true; renderWidgets(); } addLocal('Cue', 'Something went wrong: ' + m); }
  // Google access (Kiko 05:32Z): one button that checks Cue's access and, if some is missing, resets it so Google asks again.
  var ACCESS_RE = /access yet|insufficient authentication scopes/i, accessNeeded = false, accessUrl = '';
  function accessHtml() {
    if (accessUrl) return '<div class="card need"><b>Google access reset</b><div class="small">Open Cue again and click <b>Allow</b> on every Google screen. Your keys and requests are kept.</div>'
      + '<div class="actions"><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none;color:#0b1320" href="' + esc(accessUrl) + '" target="_top">Open Cue again</a></div></div>';
    if (!accessNeeded) return '';
    return '<div class="card need"><b>Cue needs Google access</b><div class="small muted">Google has not given Cue all the access it needs (Gmail or Drive). This checks and fixes it.</div>'
      + '<div class="actions"><button class="btn" data-act="fix-access" data-id="">Fix Google access</button></div></div>';
  }
  // Lines shown at once and kept across refreshes until the server's chat has them (Kiko 05:59Z: a sent message vanished
  // while Cue was busy, and Enter did nothing while the last send was still running).
  var outbox = [];
  function addLocal(who, text) { outbox.push({ who: who, text: text, request_id: threadRef(), time: new Date().toISOString() }); renderChat(); }
  function unbox() { for (var i = 0; i < arguments.length; i++) { var k = outbox.indexOf(arguments[i]); if (k >= 0) outbox.splice(k, 1); } renderChat(); }

  // Pages: the chat, one task's thread (openThread = its first task's id), or widgets. The composer serves the chat and threads.
  var openThread = '';
  function show(tab) {
    var talk = tab === 'chat' || tab === 'thread';
    $('tab-chat').setAttribute('aria-selected', talk); $('tab-widgets').setAttribute('aria-selected', tab === 'widgets');
    $('page-chat').hidden = tab !== 'chat'; $('page-thread').hidden = tab !== 'thread'; $('page-widgets').hidden = tab !== 'widgets';
    $('composer').hidden = !talk; $('pinned').hidden = !talk;
    $('box').placeholder = tab === 'thread' ? 'Reply in this thread. Cue keeps it with this task.' : 'Ask Cue, or paste an inquiry. 📎 adds briefs, photos and plans.';
    lastChat = -1; renderChat();
  }
  function goThread(id) { openThread = id; show('thread'); $('scroller').scrollTop = $('scroller').scrollHeight; $('box').focus(); }
  function goChat() { openThread = ''; show('chat'); }
  $('tab-chat').onclick = goChat;
  $('back').onclick = goChat;
  $('tab-widgets').onclick = function () { show('widgets'); loadRules(); };
  $('chip-need').onclick = function () { show('widgets'); };
  document.querySelectorAll('[data-fill]').forEach(function (b) { b.onclick = function () { $('box').value = b.getAttribute('data-fill'); $('box').focus(); }; });

  // Attachments: photos, PDFs and text files, read here and sent with the message. Photos over 500 KB are shrunk to 1800 px JPEG first.
  var pending = [], reading = 0, MAX = { count: 10, each: 10 * 1048576, total: 20 * 1048576 };
  var TYPES = { 'image/png': 1, 'image/jpeg': 1, 'image/webp': 1, 'image/gif': 1, 'application/pdf': 1, 'text/plain': 1, 'text/csv': 1, 'message/rfc822': 1 };
  var BY_EXT = { eml: 'message/rfc822', txt: 'text/plain', csv: 'text/csv', pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif' };
  function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function renderFiles() {
    $('files').innerHTML = pending.map(function (f, i) {
      return '<span class="file">📎 ' + esc(f.name) + ' <span class="muted">' + kb(f.size) + '</span><button data-rm="' + i + '" aria-label="Remove ' + esc(f.name) + '">×</button></span>';
    }).join('') + (reading ? '<span class="file muted">Reading…</span>' : '');
  }
  $('files').onclick = function (e) { var i = e.target.getAttribute && e.target.getAttribute('data-rm'); if (i != null) { pending.splice(Number(i), 1); renderFiles(); } };
  function shrink(file, done) {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size < 512000) return done(file);
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { done(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file); }, 'image/jpeg', 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(file); };
    img.src = url;
  }
  function addFiles(list) {
    Array.prototype.forEach.call(list || [], function (file) {
      var ext = String(file.name || '').split('.').pop().toLowerCase(), type = TYPES[file.type] ? file.type : BY_EXT[ext];
      if (!type) return addLocal('Cue', file.name + ': I can read photos (JPG, PNG, WebP, GIF), PDFs and text files. Save it as a PDF or JPG first.');
      if (pending.length + reading >= MAX.count) return addLocal('Cue', 'Attach ' + MAX.count + ' files at most.');
      reading++; renderFiles();
      shrink(file, function (f) {
        var r = new FileReader();
        r.onload = function () {
          reading--;
          var used = pending.reduce(function (s, x) { return s + x.size; }, 0);
          if (f.size > MAX.each) addLocal('Cue', f.name + ' is over 10 MB.');
          else if (used + f.size > MAX.total) addLocal('Cue', 'The attachments would add up to more than 20 MB.');
          else pending.push({ name: f.name || 'pasted image.png', type: TYPES[f.type] ? f.type : type, size: f.size, data: String(r.result).split(',')[1] || '' });
          renderFiles();
        };
        r.onerror = function () { reading--; addLocal('Cue', 'Could not read ' + f.name + '.'); renderFiles(); };
        r.readAsDataURL(f);
